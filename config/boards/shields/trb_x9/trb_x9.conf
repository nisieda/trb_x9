CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_POINTING=y
CONFIG_PAW3222=y

# --- Temporary debug logging (remove once kscan is confirmed working) ---
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# --- Test: force polling-based matrix scan instead of interrupt-based ---
# Hypothesis: interrupt-driven kscan isn't re-arming on this MCU, causing
# "detects once, then silent forever". Remove this line if it doesn't help.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
