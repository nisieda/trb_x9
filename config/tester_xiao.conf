# Extra config applied on top of ZMK's built-in tester_xiao shield, to get
# visibility into whether kscan/macro logic fires internally even though no
# characters are actually appearing when pins are shorted to GND.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# tester_xiao uses kscan-gpio-direct, which defaults to interrupt-driven
# detection. Voltage on D0-D5 is confirmed correct via multimeter but zero
# key events are ever detected -- this forces polling instead, to test
# whether GPIO interrupts themselves are the failure point.
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y
